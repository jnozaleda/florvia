# Comprueba los posts del blog (reglas de content/GUIA.md), que el HTML generado esté al día, que la app y el Worker no tengan errores de sintaxis, que el contador de visitas del Worker (/hit) siga funcionando y que el diagnóstico (/diagnose) no diagnostique fotos de otra planta y que el webhook de pagos de Polar valide la firma y cambie bien los planes.
# Si falla, pide al Worker (POST /ci-alert) que mande un correo. Necesita el secreto de GitHub CI_ALERT_TOKEN
# (el mismo valor que el secreto CI_ALERT_TOKEN del Worker). Sin él, la comprobación funciona igual pero no manda correo.
name: Comprobar el blog

on:
  push:
    branches: [main]
    paths: ["content/**", "tools/**", "es/**", "sitemap.xml", "index.html", "worker/**", "app/**", ".github/workflows/blog-check.yml"]
  pull_request:
    paths: ["content/**", "tools/**", "es/**", "sitemap.xml", "index.html", "worker/**", "app/**", ".github/workflows/blog-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI_ALERT_TOKEN: ${{ secrets.CI_ALERT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comprobar los posts y que el HTML esté al día
        shell: bash
        run: |
          {
            node tools/build-blog.mjs
            if [ -n "$(git status --porcelain -- es sitemap.xml app/pages.json index.html)" ]; then
              echo
              echo "El HTML generado no está al día con los posts. Ejecuta «node tools/build-blog.mjs» y sube los cambios de es/, sitemap.xml, app/pages.json e index.html:"
              git status --short -- es sitemap.xml app/pages.json index.html
              exit 1
            fi
          } 2>&1 | tee blog-check.log
      - name: Comprobar que la app y el Worker no tienen errores de sintaxis
        if: always()
        shell: bash
        run: |
          {
            status=0
            for f in app/*.js worker/src/*.js tools/*.mjs; do
              node --check "$f" || { echo "Error de sintaxis en $f"; status=1; }
            done
            exit $status
          } 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Probar el contador de visitas del Worker (/hit)
        if: always()
        shell: bash
        run: node tools/test-hit.mjs 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Probar el diagnóstico del Worker (/diagnose)
        if: always()
        shell: bash
        run: node tools/test-diagnose.mjs 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Probar los pagos con Polar (webhook y planes)
        if: always()
        shell: bash
        run: node tools/test-polar.mjs 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Probar los planes y el mes gratis (/me)
        if: always()
        shell: bash
        run: node tools/test-plans.mjs 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Probar los fallos de la IA y los avisos (cuota, tope diario)
        if: always()
        shell: bash
        run: node tools/test-ai-alerts.mjs 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Probar lluvia, sol, coordenadas, retención, avisos de actividad y valoraciones
        if: always()
        shell: bash
        run: |
          fail=0
          for t in test-rain test-sun test-coords test-retention test-notify test-ratings test-care-alias; do node tools/$t.mjs 2>&1 | tee -a blog-check.log; [ "${PIPESTATUS[0]}" = 0 ] || fail=1; done
          exit $fail
      - name: Comprobar las fichas de referencia (fuentes y procedencia)
        if: always()
        shell: bash
        run: node tools/check-referencia.mjs 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Comprobar que los sinónimos y nombres comunes están al día
        if: always()
        shell: bash
        run: node tools/build-species-seed.mjs --check 2>&1 | tee -a blog-check.log; exit "${PIPESTATUS[0]}"
      - name: Avisar por correo
        if: failure() && env.CI_ALERT_TOKEN != ''
        shell: bash
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT="$(printf 'Ha fallado la comprobación del blog.\n\nRama: %s\nCambio: %s\nVer la ejecución: %s\n\nÚltimas líneas:\n%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUN_URL" "$(tail -n 40 blog-check.log 2>/dev/null)")"
          jq -n --arg subject "Florvia · Falla la comprobación del blog" --arg text "$TEXT" '{subject: $subject, text: $text}' \
            | curl -fsS -X POST https://api.florvia.app/ci-alert -H "Content-Type: application/json" -H "X-CI-Token: $CI_ALERT_TOKEN" --data @-
